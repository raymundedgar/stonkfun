<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>STONK.SCAN — live token feed</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #0a0f10;
    --panel:     #10171a;
    --panel-2:   #141d20;
    --line:      #1f2b2e;
    --text:      #e7eeee;
    --muted:     #7f9295;
    --muted-2:   #5b6b6e;
    --accent:    #3ddc97;   /* gains / graduated */
    --down:      #ff6a5c;   /* losses */
    --amber:     #f5a623;   /* new */
    --indigo:    #6c8ef5;   /* about to graduate */
    --focus:     #cdeee0;
    --radius:    10px;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Space Grotesk', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{min-height:100vh;}
  ::selection{background:var(--accent);color:#06110c;}
  a{color:inherit;}

  .wrap{max-width:1320px;margin:0 auto;padding:20px 20px 64px;}

  /* ---------- header ---------- */
  header.top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:16px;flex-wrap:wrap;margin-bottom:18px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{
    font-family:var(--sans);font-weight:700;font-size:22px;letter-spacing:0.2px;margin:0;
  }
  .brand span.tag{
    font-family:var(--mono);font-size:11px;color:var(--muted-2);
    border:1px solid var(--line);padding:2px 6px;border-radius:5px;
  }
  .status{
    display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted-2);flex:none;}
  .dot.live{background:var(--accent);box-shadow:0 0 0 3px rgba(61,220,151,0.15);}
  .dot.live.pulsing{animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  @media (prefers-reduced-motion: reduce){.dot.live.pulsing{animation:none;}}
  button.refresh{
    font-family:var(--mono);font-size:12px;color:var(--text);
    background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
    padding:5px 10px;cursor:pointer;
  }
  button.refresh:hover{border-color:var(--muted-2);}
  button.refresh:focus-visible, input:focus-visible, select:focus-visible, .row:focus-visible, th button:focus-visible{
    outline:2px solid var(--focus);outline-offset:1px;
  }

  /* ---------- filter bar ---------- */
  .filters{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:16px;
    display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 0.7fr auto;gap:10px;
    position:sticky;
    top:12px;
    z-index:6;
  }
  .field-tight select, .field-tight button{ white-space:nowrap; }
  @media (max-width:980px){
    .filters{grid-template-columns:1fr 1fr 1fr;}
  }
  @media (max-width:560px){
    .filters{grid-template-columns:1fr 1fr;}
  }
  .field{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .field label{font-size:10.5px;color:var(--muted-2);font-family:var(--mono);letter-spacing:0.3px;}
  .field input, .field select{
    font-family:var(--mono);font-size:13px;color:var(--text);
    background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
    padding:7px 8px;width:100%;
  }
  .field input::placeholder{color:var(--muted-2);}

  /* ---------- table ---------- */
  .table-shell{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;
  }
  .scroll{
    overflow:auto;
    max-height:70vh;
  }
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px;min-width:880px;}
  thead th{
    position:sticky;top:0;background:var(--panel-2);z-index:1;
    text-align:left;font-family:var(--sans);font-weight:600;font-size:11.5px;color:var(--muted);
    padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  thead th.num{text-align:right;}
  thead th button{
    all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:inherit;
  }
  thead th button:hover{color:var(--text);}
  thead th .arrow{font-size:9px;opacity:0.6;}
  tbody tr.row{border-bottom:1px solid var(--line);cursor:pointer;}
  tbody tr.row:hover{background:rgba(255,255,255,0.02);}
  tbody tr.row:last-child{border-bottom:none;}
  td{padding:9px 12px;vertical-align:middle;white-space:nowrap;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .token-cell{display:flex;align-items:center;gap:9px;}
  .token-cell img{width:26px;height:26px;border-radius:6px;background:var(--panel-2);object-fit:cover;flex:none;}
  .token-cell .imgfallback{
    width:26px;height:26px;border-radius:6px;background:var(--panel-2);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted-2);
  }
  .token-names{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
  .token-names .sym{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--text);}
  .token-names .name{font-size:11px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
  .statusdot{width:7px;height:7px;border-radius:50%;flex:none;margin-right:9px;}
  .statusdot.new{background:var(--amber);}
  .statusdot.aboutToGraduate{background:var(--indigo);}
  .statusdot.graduated{background:var(--accent);}
  .status-wrap{display:flex;align-items:center;}
  .pill{
    font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:99px;
    border:1px solid var(--line);color:var(--muted);white-space:nowrap;
  }
  .chg-up{color:var(--accent);}
  .chg-down{color:var(--down);}
  .quote-badge{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;}
  .quote-badge img{width:14px;height:14px;border-radius:3px;}

  .empty, .error, .loading{padding:48px 20px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px;}
  .error{color:var(--down);}
  .loading .spin{
    display:inline-block;width:14px;height:14px;border-radius:50%;
    border:2px solid var(--line);border-top-color:var(--accent);
    animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.loading .spin{animation:none;}}

  /* ---------- footer / pagination ---------- */
  .foot{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:12px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--muted);
  }
  .pager{display:flex;align-items:center;gap:8px;}
  .pager button{
    font-family:var(--mono);font-size:12px;color:var(--text);background:var(--panel-2);
    border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;
  }
  .pager button:disabled{opacity:0.35;cursor:not-allowed;}
  .pager button:hover:not(:disabled){border-color:var(--muted-2);}

  /* toast */
  #toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(10px);
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:var(--mono);font-size:12px;padding:8px 14px;border-radius:8px;
    opacity:0;pointer-events:none;transition:opacity 0.15s ease, transform 0.15s ease;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* mobile card fallback for very narrow screens keeps the table but scrolls; footer wraps */
  @media (max-width:520px){
    .wrap{padding:14px 12px 48px;}
    .brand h1{font-size:18px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <a href="/" style="text-decoration:none;color:inherit;">
        <h1>STONK.SCAN</h1>
      </a>
    </div>
    <div class="status">
      <span class="dot" id="liveDot"></span>
      <span id="statusText">connecting…</span>
      <button class="refresh" id="refreshBtn" type="button">refresh</button>
    </div>
  </header>

  <div class="filters">
    <div class="field">
      <label for="q">search</label>
      <input id="q" type="text" placeholder="name, symbol or mint" autocomplete="off" />
    </div>
    <div class="field">
      <label for="sort">sort</label>
      <select id="sort">
        <option value="marketCap">market cap</option>
        <option value="newest">newest</option>
        <option value="volume" selected>volume</option>
      </select>
    </div>
    <div class="field">
      <label for="status">status</label>
      <select id="status">
        <option value="">any</option>
        <option value="new">new</option>
        <option value="aboutToGraduate">about to graduate</option>
        <option value="graduated" selected>graduated</option>
      </select>
    </div>
    <div class="field">
      <label for="quoteMint">quote mint</label>
      <input id="quoteMint" type="text" placeholder="paired token mint" autocomplete="off" />
    </div>
    <div class="field field-tight">
      <label for="pageSize">page size</label>
      <select id="pageSize">
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100" selected>100</option>
      </select>
    </div>
    <div class="field field-tight">
      <label>&nbsp;</label>
      <button class="refresh" id="resetBtn" type="button">reset</button>
    </div>
  </div>

  <div class="table-shell">
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th style="min-width:190px;">token</th>
            <th>quote</th>
            <th class="num" data-key="priceUsd"><button type="button">price <span class="arrow"></span></button></th>
            <th class="num" data-key="marketCapUsd"><button type="button">mcap <span class="arrow"></span></button></th>
            <th class="num" data-key="peakMarketCapUsd"><button type="button">peak mcap <span class="arrow"></span></button></th>
            <th class="num" data-key="volume24hUsd"><button type="button">24h vol <span class="arrow"></span></button></th>
            <th class="num" data-key="priceChange24h"><button type="button">24h chg <span class="arrow"></span></button></th>
            <th>status</th>
            <th class="num" data-key="createdAt"><button type="button">age <span class="arrow"></span></button></th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="9"><div class="loading"><span class="spin"></span>loading tokens…</div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="foot">
      <span id="countText">—</span>
      <div class="pager">
        <button id="prevBtn" type="button">← prev</button>
        <span id="pageText">page 1</span>
        <button id="nextBtn" type="button">next →</button>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var API = "/api/tokens";
  var SORTABLE_KEYS = ["priceUsd","marketCapUsd","peakMarketCapUsd","volume24hUsd","priceChange24h","createdAt"];
  var state = {
    page: 1,
    pageSize: 100,
    sort: "volume",
    localSortKey: 'volume24hUsd',
    localSortDir: -1, // -1 desc, 1 asc
    cache: new Map(),   // key -> {ts, payload}
    inFlight: null,
    rateLimitedUntil: null, // ms timestamp; set while honouring a 429 Retry-After
    retryTimer: null
  };
  var CACHE_TTL_MS = 15000;
  var suppressPopstate = false;

  var els = {
    q: document.getElementById('q'),
    sort: document.getElementById('sort'),
    status: document.getElementById('status'),
    quoteMint: document.getElementById('quoteMint'),
    pageSize: document.getElementById('pageSize'),
    resetBtn: document.getElementById('resetBtn'),
    refreshBtn: document.getElementById('refreshBtn'),
    tbody: document.getElementById('tbody'),
    countText: document.getElementById('countText'),
    pageText: document.getElementById('pageText'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    liveDot: document.getElementById('liveDot'),
    statusText: document.getElementById('statusText'),
    toast: document.getElementById('toast')
  };

  // ---------- formatting helpers ----------
  function compactUsd(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    var abs = Math.abs(n);
    if (abs === 0) return '$0';
    if (abs < 0.01){
      // small prices: show up to 6 significant decimals
      return '$' + n.toFixed(6).replace(/0+$/,'').replace(/\.$/,'');
    }
    var fmt = new Intl.NumberFormat('en-US', {
      style:'currency', currency:'USD', notation:'compact',
      maximumFractionDigits: abs < 1 ? 4 : 2
    });
    return fmt.format(n);
  }

  function compactNum(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    return new Intl.NumberFormat('en-US', { notation:'compact', maximumFractionDigits: 2 }).format(n);
  }

  function pct(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    var s = (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
    return s;
  }

  function ageLabel(iso){
    if (!iso) return '—';
    var ms = Date.now() - new Date(iso).getTime();
    if (ms < 0) ms = 0;
    var min = ms / 60000, hr = min/60, day = hr/24, mo = day/30.44, yr = day/365.25;
    if (min < 60) return Math.max(1, Math.round(min)) + 'm';
    if (hr < 24) return Math.round(hr) + 'h';
    if (day < 30.44) return Math.round(day) + 'd';
    if (day < 365.25) return Math.round(mo) + 'mo';
    return yr.toFixed(1) + 'y';
  }

  function statusLabel(s){
    if (s === 'aboutToGraduate') return 'about to graduate';
    return s || '—';
  }

  function debounce(fn, ms){
    var t;
    return function(){
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(null, args); }, ms);
    };
  }

  function toast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ els.toast.classList.remove('show'); }, 1400);
  }

  // ---------- URL <-> state sync ----------
  function readStateFromUrl(){
    var sp = new URLSearchParams(location.search);

    var q = sp.get('q') || '';
    var sortVal = sp.get('sort');
    var statusVal = sp.get('status');
    var quoteMint = sp.get('quoteMint') || '';
    var page = parseInt(sp.get('page'), 10);
    var pageSize = parseInt(sp.get('pageSize'), 10);
    var sortKey = sp.get('sortKey');
    var sortDir = sp.get('sortDir');

    if (els.q) els.q.value = q;
    if (els.sort){
      var validSorts = ['marketCap','newest','volume'];
      els.sort.value = (sortVal && validSorts.indexOf(sortVal) !== -1) ? sortVal : 'volume';
    }
    if (els.status){
      var validStatuses = ['', 'new', 'aboutToGraduate', 'graduated'];
      // distinguish "no ?status param" (use markup default) from "?status=" (explicit "any")
      els.status.value = (statusVal !== null && validStatuses.indexOf(statusVal) !== -1) ? statusVal : (statusVal === null ? els.status.value : '');
    }
    if (els.quoteMint) els.quoteMint.value = quoteMint;

    state.page = (!isNaN(page) && page > 0) ? page : 1;
    state.pageSize = ([25,50,100].indexOf(pageSize) !== -1) ? pageSize : 100;
    if (els.pageSize) els.pageSize.value = String(state.pageSize);

    state.localSortKey = (sortKey && SORTABLE_KEYS.indexOf(sortKey) !== -1) ? sortKey : 'volume24hUsd';
    state.localSortDir = (sortDir === '1') ? 1 : -1;
  }

  function writeUrlToState(opts){
    opts = opts || {};
    var push = !!opts.push;

    var p = new URLSearchParams();
    if (els.q.value.trim()) p.set('q', els.q.value.trim());
    p.set('sort', els.sort.value);
    if (els.status.value) p.set('status', els.status.value);
    if (els.quoteMint.value.trim()) p.set('quoteMint', els.quoteMint.value.trim());
    p.set('page', String(state.page));
    p.set('pageSize', String(state.pageSize));
    if (state.localSortKey){
      p.set('sortKey', state.localSortKey);
      p.set('sortDir', String(state.localSortDir));
    }

    var query = p.toString();
    var newUrl = location.pathname + (query ? '?' + query : '') + location.hash;
    var currentUrl = location.pathname + location.search + location.hash;
    if (newUrl === currentUrl) return;

    suppressPopstate = true;
    if (push){
      history.pushState({ stonkscan: true }, '', newUrl);
    } else {
      history.replaceState({ stonkscan: true }, '', newUrl);
    }
    // popstate never fires for pushState/replaceState calls themselves, but reset defensively
    suppressPopstate = false;
  }

  // ---------- building the request ----------
  function buildParams(){
    var p = new URLSearchParams();
    if (els.q.value.trim()) p.set('q', els.q.value.trim());
    p.set('sort', els.sort.value);
    if (els.status.value) p.set('status', els.status.value);
    if (els.quoteMint.value.trim()) p.set('quoteMint', els.quoteMint.value.trim());
    p.set('page', String(state.page));
    p.set('pageSize', String(state.pageSize));
    return p;
  }

  function applyLocalSort(tokens){
    if (!state.localSortKey) return tokens;
    var key = state.localSortKey, dir = state.localSortDir;
    var copy = tokens.slice();
    copy.sort(function(a,b){
      var av = getSortValue(a, key), bv = getSortValue(b, key);
      if (av === null || av === undefined) av = -Infinity;
      if (bv === null || bv === undefined) bv = -Infinity;
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
    return copy;
  }

  function getSortValue(t, key){
    if (key === 'createdAt') return t.createdAt ? new Date(t.createdAt).getTime() : null;
    if (key === 'priceUsd') return t.market ? t.market.priceUsd : null;
    if (key === 'marketCapUsd') return t.market ? t.market.marketCapUsd : null;
    if (key === 'peakMarketCapUsd') return t.market ? t.market.peakMarketCapUsd : null;
    if (key === 'volume24hUsd') return t.market ? t.market.volume24hUsd : null;
    if (key === 'priceChange24h') return t.market ? t.market.priceChange24h : null;
    return null;
  }

  // ---------- rendering ----------
  function renderRows(tokens){
    if (!tokens.length){
      els.tbody.innerHTML = '<tr><td colspan="9"><div class="empty">no tokens match these filters — try widening the range or clearing a filter.</div></td></tr>';
      return;
    }
    var html = tokens.map(function(t){
      var m = t.market || {};
      var chgClass = (m.priceChange24h || 0) >= 0 ? 'chg-up' : 'chg-down';
      var img = t.imageUrl ? resolveAsset(t.imageUrl) : '';
      var qImg = t.quote && t.quote.logoUrl ? resolveAsset(t.quote.logoUrl) : '';
      var name = escapeHtml(t.name || '');
      var sym = escapeHtml(t.symbol || '');
      var qsym = t.quote ? escapeHtml(t.quote.symbol || '') : '—';

      return (
        '<tr class="row" tabindex="0" data-mint="' + escapeAttr(t.mint || '') + '">' +
          '<td><div class="token-cell">' +
            (img ? '<img src="' + escapeAttr(img) + '" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'imgfallback\',textContent:\'' + (sym[0]||'?') + '\'}))" alt="" />' :
                   '<div class="imgfallback">' + (sym[0] || '?') + '</div>') +
            '<div class="token-names"><span class="sym">' + sym + '</span><span class="name">' + name + '</span></div>' +
          '</div></td>' +
          '<td>' + (qsym !== '—' ? '<span class="quote-badge">' + (qImg ? '<img src="'+escapeAttr(qImg)+'" alt="" onerror="this.remove()"/>' : '') + qsym + '</span>' : '—') + '</td>' +
          '<td class="num">' + compactUsd(m.priceUsd) + '</td>' +
          '<td class="num">' + compactUsd(m.marketCapUsd) + '</td>' +
          '<td class="num">' + compactUsd(m.peakMarketCapUsd) + '</td>' +
          '<td class="num">' + compactUsd(m.volume24hUsd) + '</td>' +
          '<td class="num ' + chgClass + '">' + pct(m.priceChange24h) + '</td>' +
          '<td><span class="status-wrap"><span class="statusdot ' + (t.status||'') + '"></span><span class="pill">' + statusLabel(t.status) + '</span></span></td>' +
          '<td class="num">' + ageLabel(t.createdAt) + '</td>' +
        '</tr>'
      );
    }).join('');
    els.tbody.innerHTML = html;

    Array.prototype.forEach.call(els.tbody.querySelectorAll('.row'), function(row){
      row.addEventListener('click', onRowActivate);
      row.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onRowActivate.call(row); }
      });
    });
  }

  function onRowActivate(){
    var mint = this.getAttribute('data-mint');
    if (!mint) return;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(mint).then(function(){ toast('mint copied'); });
    }
  }

  function resolveAsset(u){
    if (!u) return '';
    if (u.indexOf('http') === 0) return u;
    // relative asset paths from the API (e.g. /api/asset/...) live on stonk.fun
    return 'https://www.stonkfun.xyz' + u;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }

  function updateSortArrows(){
    Array.prototype.forEach.call(document.querySelectorAll('thead th[data-key]'), function(th){
      var arrow = th.querySelector('.arrow');
      var key = th.getAttribute('data-key');
      if (key === state.localSortKey){
        arrow.textContent = state.localSortDir === -1 ? '▼' : '▲';
      } else {
        arrow.textContent = '';
      }
    });
  }

  // ---------- API error contract ----------
  // Every failure the API returns is shaped { error: { code, message } }.
  // `code` is stable and is what we branch on; `message` is for humans and
  // may be reworded upstream, so it's only used as a fallback.
  var ERROR_MESSAGES = {
    invalid_request:     'invalid request — check the search or filter values.',
    forbidden:            'that action was refused.',
    not_found:            'no matching resource found.',
    method_not_allowed:   'wrong request method for this endpoint.',
    conflict:             'that request conflicts with the current state.',
    rate_limited:         'rate limit hit.',
    internal:             'something broke upstream — safe to retry.',
    service_unavailable:  'the token feed is temporarily unavailable.'
  };
  // Codes where retrying the exact same request right away is known-safe.
  var AUTO_RETRYABLE = { internal: true, service_unavailable: true };
  // conflict is deliberately excluded: per the API docs, a 409 means the
  // moment was wrong (e.g. a launch payment already landed, or a fee claim
  // isn't ready yet) and blindly retrying/re-paying is the wrong move —
  // it needs a person to look, not an auto-retry loop.

  function describeError(code, fallbackMessage, retryAfterSec){
    var msg = ERROR_MESSAGES[code] || fallbackMessage || 'unknown error';
    if (code === 'rate_limited' && retryAfterSec) msg += ' retry in ' + retryAfterSec + 's.';
    return msg;
  }

  // ---------- fetch flow ----------
  function currentCacheKey(params){ return params.toString(); }

  function load(){
    writeUrlToState({ push: false });

    if (state.rateLimitedUntil && Date.now() < state.rateLimitedUntil){
      // still cooling down — the countdown timer will call load() again itself
      return;
    }

    var params = buildParams();
    var key = currentCacheKey(params);
    var cached = state.cache.get(key);
    if (cached && (Date.now() - cached.ts) < CACHE_TTL_MS){
      handlePayload(cached.payload, true);
      return;
    }

    setStatus('loading', 'fetching…');
    els.tbody.innerHTML = '<tr><td colspan="9"><div class="loading"><span class="spin"></span>loading tokens…</div></td></tr>';

    fetch(API + '?' + params.toString())
      .then(function(res){
        var retryAfterHeader = res.headers.get('Retry-After');
        var retryAfterSec = retryAfterHeader ? parseInt(retryAfterHeader, 10) : null;
        return res.json()
          .catch(function(){ return null; }) // body wasn't JSON (or was empty)
          .then(function(payload){
            return { ok: res.ok, status: res.status, payload: payload, retryAfterSec: retryAfterSec };
          });
      })
      .then(function(result){
        var payload = result.payload;
        var apiError = payload && payload.error;

        if (!result.ok || apiError){
          var code = apiError ? apiError.code : null;
          var rawMessage = apiError ? apiError.message : null;
          var err = new Error(describeError(code, rawMessage || ('request failed (' + result.status + ')'), result.retryAfterSec));
          err.code = code;
          err.status = result.status;
          err.retryAfterSec = result.retryAfterSec;
          throw err;
        }

        state.rateLimitedUntil = null;
        state.cache.set(key, { ts: Date.now(), payload: payload });
        handlePayload(payload, false);
      })
      .catch(function(err){
        renderError(err);
      });
  }

  function renderError(err){
    var code = err.code;

    if (code === 'rate_limited' && err.retryAfterSec){
      setStatus('error', 'rate limited');
      state.rateLimitedUntil = Date.now() + (err.retryAfterSec * 1000);
      els.tbody.innerHTML = '<tr><td colspan="9"><div class="error">' + escapeHtml(err.message) + '</div></td></tr>';
      startRetryCountdown(err.retryAfterSec);
      return;
    }

    setStatus('error', 'connection issue');
    var canAutoRetry = AUTO_RETRYABLE[code] || !code; // unknown/network errors are also safe to retry
    var actionHtml = canAutoRetry
      ? '<button class="refresh" id="retryBtn" type="button">retry</button>'
      : '<button class="refresh" onclick="location.reload()">reload</button>';
    els.tbody.innerHTML = '<tr><td colspan="9"><div class="error">couldn\'t load tokens — ' + escapeHtml(err.message) + '. ' + actionHtml + '</div></td></tr>';

    var retryBtn = document.getElementById('retryBtn');
    if (retryBtn) retryBtn.addEventListener('click', function(){ load(); });
  }

  function startRetryCountdown(seconds){
    var remaining = seconds;
    clearInterval(state.retryTimer);
    state.retryTimer = setInterval(function(){
      remaining--;
      var cell = els.tbody.querySelector('.error');
      if (cell) cell.textContent = 'rate limited — retrying in ' + Math.max(remaining, 0) + 's…';
      if (remaining <= 0){
        clearInterval(state.retryTimer);
        state.rateLimitedUntil = null;
        load();
      }
    }, 1000);
  }

  function handlePayload(payload, fromCache){
    var data = payload.data || {};
    var tokens = data.tokens || [];
    var pagination = data.pagination || { page: state.page, pageSize: state.pageSize, total: tokens.length, totalPages: 1 };

    var sorted = applyLocalSort(tokens);
    renderRows(sorted);
    updateSortArrows();

    els.countText.textContent = tokens.length + ' of ' + pagination.total.toLocaleString() + ' total';
    els.pageText.textContent = 'page ' + pagination.page + ' / ' + pagination.totalPages.toLocaleString();
    els.prevBtn.disabled = pagination.page <= 1;
    els.nextBtn.disabled = pagination.page >= pagination.totalPages;

    var genAt = payload.meta && payload.meta.generatedAt;
    setStatus('live', (fromCache ? 'cached · ' : 'live · ') + (genAt ? new Date(genAt).toLocaleTimeString() : new Date().toLocaleTimeString()));
  }

  function setStatus(kind, text){
    els.statusText.textContent = text;
    els.liveDot.className = 'dot' + (kind === 'live' ? ' live pulsing' : kind === 'loading' ? ' live' : '');
  }

  // ---------- events ----------
  var debouncedReload = debounce(function(){ state.page = 1; load(); }, 400);

  [els.q, els.quoteMint].forEach(function(el){
    if (el) el.addEventListener('input', debouncedReload);
  });
  [els.sort, els.status].forEach(function(el){
    if (el) el.addEventListener('change', function(){ state.page = 1; load(); });
  });
  if (els.pageSize) els.pageSize.addEventListener('change', function(){
    state.pageSize = Number(els.pageSize.value);
    state.page = 1;
    load();
  });
  if (els.prevBtn) els.prevBtn.addEventListener('click', function(){ if (state.page > 1){ state.page--; load(); } });
  if (els.nextBtn) els.nextBtn.addEventListener('click', function(){ state.page++; load(); });
  if (els.refreshBtn) els.refreshBtn.addEventListener('click', function(){ state.cache.clear(); load(); });
  if (els.resetBtn) els.resetBtn.addEventListener('click', function(){
    if (els.q) els.q.value='';
    if (els.sort) els.sort.value='volume';
    if (els.status) els.status.value='graduated';
    if (els.quoteMint) els.quoteMint.value='';
    if (els.pageSize) els.pageSize.value='100';
    state.pageSize = 100; state.page = 1; state.localSortKey = 'volume24hUsd';
    load();
  });

  Array.prototype.forEach.call(document.querySelectorAll('thead th[data-key]'), function(th){
    var btn = th.querySelector('button');
    if (!btn) return;
    btn.addEventListener('click', function(){
      var key = th.getAttribute('data-key');
      if (state.localSortKey === key){
        state.localSortDir *= -1;
      } else {
        state.localSortKey = key;
        state.localSortDir = -1;
      }
      var params = buildParams();
      var cached = state.cache.get(currentCacheKey(params));
      if (cached) handlePayload(cached.payload, true);
      updateSortArrows();
      writeUrlToState({ push: false });
    });
  });

  // browser back/forward: re-read filters/page/sort from the URL and reload
  window.addEventListener('popstate', function(){
    if (suppressPopstate) return;
    readStateFromUrl();
    updateSortArrows();
    load();
  });

  // periodic soft refresh every 5 minutes (only clears cache, load() re-fetches on next interaction
  // or immediately if the user is idle on page 1 with no filters)
  setInterval(function(){
    state.cache.clear();
    load();
  }, 500000);

  readStateFromUrl();
  updateSortArrows();
  load();
})();
</script>
</body>
</html>
